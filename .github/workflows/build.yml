name: Build Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EAS_NO_VCS: 1
      EXPO_TOKEN: ${{ secrets.EXPO_EAS_TOKEN }}
      APP_NAME: "Albion Online Android Radar"
      APP_SLUG: "1"
      NODE_OPTIONS: "--max-old-space-size=6144"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install EAS CLI
        run: pnpm add -g eas-cli

      - name: Generate Android native project
        run: npx expo prebuild --platform android --clean

      - name: Build Release APK (local)
        run: eas build --platform android --profile release --local --non-interactive

      - name: Find APK location
        run: |
          echo "Looking for APK files..."
          find . -name "*.apk" -type f 2>/dev/null
          ls -la android/app/build/outputs/apk/release/ 2>/dev/null || true

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: albion-radar-release-apk
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            *.apk
          retention-days: 30
          if-no-files-found: warn
